<!doctype html><html><head><meta charset="utf-8"><style>
    html,body{margin:0;padding:0;background:#ffffff;}
    .icon{width:1024px;height:1024px;display:block;}
    svg{display:block;width:1024px;height:1024px;}
  </style></head><body>
<svg class="icon" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6eefb"/>
    </linearGradient>
    <linearGradient id="disc3" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#7fd8ff"/>
      <stop offset="0.5" stop-color="#17aaf0"/>
      <stop offset="1" stop-color="#0070c8"/>
    </linearGradient>
    <radialGradient id="spec3" cx="0.34" cy="0.24" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="discShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="26" stdDeviation="26" flood-color="#5b7ba6" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="232" fill="url(#bg3)"/>
  <g filter="url(#discShadow)">
    <circle cx="512" cy="512" r="330" fill="url(#disc3)"/>
  </g>
  <circle cx="512" cy="512" r="330" fill="url(#spec3)"/>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.35">
    <circle cx="512" cy="512" r="286" stroke-width="4"/>
    <circle cx="512" cy="512" r="244" stroke-width="4"/>
    <circle cx="512" cy="512" r="202" stroke-width="4"/>
    <circle cx="512" cy="512" r="160" stroke-width="4"/>
  </g>
  <circle cx="512" cy="512" r="86" fill="#eaf7ff" opacity="0.92"/>
  <circle cx="512" cy="512" r="18" fill="#0070c8" opacity="0.55"/>
</svg></body></html>
