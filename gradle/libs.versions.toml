[versions]
agp = "9.3.2"
kotlin = "2.4.10"

coreKtx = "1.19.0"
activityCompose = "1.13.0"
window = "1.5.0"
lifecycle = "2.11.0"
media3 = "1.11.1"

# Compose Multiplatform artifacts. lyrics-ui / gaze-capsule are published as
# Multiplatform libraries, so the app consumes the same org.jetbrains.compose
# family for a consistent resolved graph on Android.
compose = "1.12.0"
composeMaterial3 = "1.9.0"

coil = "2.7.0"
okhttp = "4.12.0"
palette = "1.0.0"

lyrics = "1.0.19"
lyricsCore = "0.5.0"
capsule = "2.1.1-patch2"

# 词幕 (Lyricon) provider bridge — pushes the current song/lyrics/playback state to Lyricon so it
# can render a status-bar / lock-screen lyric. Apache-2.0, published on Maven Central.
lyricon = "0.1.70"

# Liquid Glass (Backdrop) — real backdrop-sampling glass for the floating tab bar and mini player.
# Apache-2.0, built against the same Compose Multiplatform version this app uses.
backdrop = "2.0.1"

# 自定义源 (custom source) engine: QuickJS packaged for Android. A source is a JavaScript file that
# speaks the LX Music host API (`globalThis.lx`), and every source is written with `async`/`await` and
# Promises, so the app needs a real ES2020 engine **with a microtask queue that the embedder drains**.
#
# `app.cash.quickjs:quickjs-android:0.9.2` resolves but cannot run a source: its `Context::eval` only
# calls `JS_Eval` and never `JS_ExecutePendingJob` (verified against the 0.9.2 sources), so a Promise
# never settles and every `await` hangs forever. Rhino has no Promise/async at all; J2V8 is ~10x the
# size. `quickjs-kt` exposes a suspend `evaluate()` that awaits pending jobs, async host functions,
# and an evaluation timeout — exactly the three things this feature needs. Apache-2.0.
quickjsKt = "1.0.15"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-window = { group = "androidx.window", name = "window", version.ref = "window" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
kotlinx-coroutines-guava = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-guava", version = "1.10.2" }

compose-runtime = { group = "org.jetbrains.compose.runtime", name = "runtime", version.ref = "compose" }
compose-foundation = { group = "org.jetbrains.compose.foundation", name = "foundation", version.ref = "compose" }
compose-ui = { group = "org.jetbrains.compose.ui", name = "ui", version.ref = "compose" }
compose-ui-graphics = { group = "org.jetbrains.compose.ui", name = "ui-graphics", version.ref = "compose" }
compose-ui-tooling-preview = { group = "org.jetbrains.compose.ui", name = "ui-tooling-preview", version.ref = "compose" }
compose-material3 = { group = "org.jetbrains.compose.material3", name = "material3", version.ref = "composeMaterial3" }

media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }

coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
palette = { group = "androidx.palette", name = "palette-ktx", version.ref = "palette" }

lyrics-ui = { group = "com.mocharealm.accompanist", name = "lyrics-ui", version.ref = "lyrics" }
lyrics-core = { group = "com.mocharealm.accompanist", name = "lyrics-core", version.ref = "lyricsCore" }
gaze-capsule = { group = "com.mocharealm.gaze", name = "capsule", version.ref = "capsule" }

lyricon-provider = { group = "io.github.proify.lyricon", name = "provider", version.ref = "lyricon" }

backdrop = { group = "io.github.kyant0", name = "backdrop", version.ref = "backdrop" }

quickjs-kt = { module = "io.github.dokar3:quickjs-kt", version.ref = "quickjsKt" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
